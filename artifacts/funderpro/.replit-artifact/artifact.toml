kind = "web"
previewPath = "/"
title = "FunderPro Clone"
version = "1.0.0"
id = "artifacts/funderpro"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21639

[services.development]
run = "pnpm --filter @workspace/funderpro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/funderpro", "run", "build" ]
publicDir = "artifacts/funderpro/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21639"
BASE_PATH = "/"
